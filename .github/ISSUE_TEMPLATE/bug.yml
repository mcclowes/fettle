name: Bug report
description: Report a reproducible problem in Fettle
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check the documentation and existing issues before filing a new report. Remove private source code and credentials from anything you attach.
  - type: input
    id: version
    attributes:
      label: Fettle version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 26.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or diagnostics if they help.
